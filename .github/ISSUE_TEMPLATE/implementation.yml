name: Implementation task
description: A scoped, testable engineering increment
title: ""
labels: ["implementation"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observable result should exist when this issue is complete?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: List objective checks, including point-in-time or clean-room constraints where relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Tests, docs, examples, screenshots, or reports that will demonstrate completion.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: Uses fictional/public inputs only
          required: true
        - label: Does not broaden authority or bypass human review
          required: true
