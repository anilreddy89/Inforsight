name: Implementation task
description: Propose a scoped, testable engineering change
title: "[Implementation]"
labels: [ "implementation" ]
body:
- type: markdown
  attributes:
    value: |
      Use this form for a focused implementation task. Describe the observable outcome and objective completion checks without including confidential or proprietary information.

- type: textarea
  id: outcome
  attributes:
    label: Outcome
    description: What observable result should exist when this issue is complete?
    placeholder: Describe the capability, behavior, or artifact that should be delivered.
  validations:
    required: true

- type: textarea
  id: context
  attributes:
    label: Context
    description: Why is this change needed, and what existing behavior or backlog item does it address?
    placeholder: Include relevant background, constraints, and links to related issues or documentation.
  validations:
    required: true

- type: textarea
  id: acceptance
  attributes:
    label: Acceptance checks
    description: List objective, testable conditions that must be satisfied.
    placeholder: |
      - [ ] The expected behavior or artifact is implemented.
      - [ ] Automated tests cover the changed behavior.
      - [ ] Relevant documentation is updated.
      - [ ] `make check` passes.
  validations:
    required: true

- type: textarea
  id: evidence
  attributes:
    label: Evidence
    description: What evidence will demonstrate that the issue is complete?
    placeholder: List test output, examples, documentation, screenshots, or reports expected during review.
  validations:
    required: true

- type: textarea
  id: out_of_scope
  attributes:
    label: Out of scope
    description: Identify adjacent work intentionally deferred to separate issues.
    placeholder: List anything that should not be implemented as part of this issue.

- type: textarea
  id: dependencies
  attributes:
    label: Dependencies
    description: List prerequisites, blocked issues, or follow-up work, if any.
    placeholder: Enter issue links or write "None."

- type: checkboxes
  id: boundaries
  attributes:
    label: Boundaries
    description: Confirm that the proposed work respects the repository's contribution requirements.
    options:
    - label: This issue uses only fictional data, public sources, and original implementation.
      required: true
    - label: This issue does not include credentials, customer information, or proprietary material.
      required: true
    - label: This issue preserves point-in-time, authority, and human-review boundaries where applicable.
      required: true
