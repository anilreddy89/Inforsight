name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository boundaries
        run: ./scripts/check_repository_boundaries.sh

      - name: Install contract test dependencies
        run: python -m pip install -r data-contracts/requirements-test.txt

      - name: Install simulator and modeling dependencies
        run: python -m pip install -e simulator

      - name: Run repository checks
        run: make check
