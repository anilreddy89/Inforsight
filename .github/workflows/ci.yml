name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boundary-and-contracts:
    name: Boundary & Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            data-contracts/requirements-test.txt
            inference-runtime/pyproject.toml
            simulator/pyproject.toml

      - name: Install contract test dependencies
        run: python -m pip install -r data-contracts/requirements-test.txt

      - name: Install runtime and simulator packages
        run: |
          python -m pip install -e inference-runtime
          python -m pip install -e simulator

      - name: Run boundary and contract checks
        run: make check-contracts

  v1-v3-pipeline-checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v1-v3 Foundation
            command: make assessment-check observation-check temporal-split-check
          - name: v1-v3 Feature & Baseline Models
            command: make feature-pipeline-check logistic-baseline-check boosted-comparison-check feature-diagnostics-check
          - name: v1-v3 Authorization & Leakage
            command: make scoring-authorization-check leakage-check
          - name: v2 Corpus & Evaluation
            command: make v2-corpus-check v2-evaluation-check v2-acceptance-check
          - name: v3 Corpus & Evaluation
            command: make v3-corpus-check v3-evaluation-check v3-acceptance-check
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            data-contracts/requirements-test.txt
            inference-runtime/pyproject.toml
            simulator/pyproject.toml

      - name: Install contract test dependencies
        run: python -m pip install -r data-contracts/requirements-test.txt

      - name: Install runtime, simulator, and modeling dependencies
        run: |
          python -m pip install -e inference-runtime
          python -m pip install -e simulator

      - name: Run v1-v3 pipeline checks
        run: ${{ matrix.command }}

  v4-v5-diagnostics-checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v4 Diagnostics & Qualification
            command: make r2-13-diagnostic-readiness-check r2-14-qualification-check
          - name: v5 Diagnostic Contracts
            command: make r2-14a-diagnostic-contract-check r2-14ba-diagnostic-contract-check
          - name: v5 Diagnostics
            command: make r2-14b-diagnostic-check r2-14bb-diagnostic-check
          - name: v6 Contract & Qualification
            command: make r2-14c-contract-check r2-14d-qualification-check
          - name: v6 Evaluation & Acceptance
            command: make v6-evaluation-check v6-acceptance-check
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            data-contracts/requirements-test.txt
            inference-runtime/pyproject.toml
            simulator/pyproject.toml

      - name: Install contract test dependencies
        run: python -m pip install -r data-contracts/requirements-test.txt

      - name: Install runtime, simulator, and modeling dependencies
        run: |
          python -m pip install -e inference-runtime
          python -m pip install -e simulator

      - name: Run v4-v5 diagnostics and qualification checks
        run: ${{ matrix.command }}

  simulator-unit-tests:
    name: Simulator Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: A-F
            pattern: 'test_[a-f]*.py'
          - name: G-M
            pattern: 'test_[g-m]*.py'
          - name: N-S
            pattern: 'test_[n-s]*.py'
          - name: T-Z
            pattern: 'test_[t-z]*.py'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            data-contracts/requirements-test.txt
            inference-runtime/pyproject.toml
            simulator/pyproject.toml

      - name: Install contract test dependencies
        run: python -m pip install -r data-contracts/requirements-test.txt

      - name: Install runtime, simulator, and modeling dependencies
        run: |
          python -m pip install -e inference-runtime
          python -m pip install -e simulator

      - name: Run complete simulator unit test suite
        run: python -m unittest discover -s simulator/tests -p '${{ matrix.pattern }}' -v

  scaffold-checks:
    name: CI Completion Gate (scaffold-checks)
    needs:
      - boundary-and-contracts
      - v1-v3-pipeline-checks
      - v4-v5-diagnostics-checks
      - simulator-unit-tests
      - inference-runtime-checks
      - serving-checks
      - dashboard-checks
      - dashboard-app-test
      - read-only-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm all checks passed
        run: echo "All parallel CI validation jobs passed successfully."

  inference-runtime-checks:
    name: Inference Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: inference-runtime/pyproject.toml

      - name: Install inference runtime
        run: python -m pip install -e inference-runtime

      - name: Run inference runtime checks
        run: make inference-runtime-check

  serving-checks:
    name: Serving Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            inference-runtime/pyproject.toml
            serving/requirements-test.txt
            simulator/pyproject.toml

      - name: Install serving dependencies
        run: |
          python -m pip install -e inference-runtime
          python -m pip install -e simulator
          python -m pip install -r serving/requirements-test.txt

      - name: Run serving gateway checks
        run: make serving-gateway-check

  dashboard-checks:
    name: Dashboard Services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            inference-runtime/pyproject.toml
            dashboard/requirements.txt
            simulator/pyproject.toml

      - name: Install dashboard dependencies
        run: |
          python -m pip install -e inference-runtime
          python -m pip install -e simulator
          python -m pip install -r dashboard/requirements.txt

      - name: Run dashboard service checks
        run: MPLBACKEND=Agg MPLCONFIGDIR=/tmp/mplconfig make dashboard-check

  dashboard-app-test:
    name: Streamlit AppTest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            inference-runtime/pyproject.toml
            dashboard/requirements.txt
            simulator/pyproject.toml

      - name: Install dashboard dependencies
        run: |
          python -m pip install -e inference-runtime
          python -m pip install -e simulator
          python -m pip install -r dashboard/requirements.txt

      - name: Run headless Streamlit interaction tests
        run: MPLBACKEND=Agg MPLCONFIGDIR=/tmp/mplconfig make dashboard-app-test

  read-only-qualification:
    name: Read-only Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            data-contracts/requirements-test.txt
            inference-runtime/pyproject.toml
            serving/requirements-test.txt
            dashboard/requirements.txt
            simulator/pyproject.toml

      - name: Install complete qualification dependencies
        run: |
          python -m pip install -r data-contracts/requirements-test.txt
          python -m pip install -e inference-runtime
          python -m pip install -e simulator
          python -m pip install -r serving/requirements-test.txt
          python -m pip install -r dashboard/requirements.txt

      - name: Run full check and verify read-only behavior
        run: |
          MPLBACKEND=Agg MPLCONFIGDIR=/tmp/mplconfig make read-only-qualification-check
