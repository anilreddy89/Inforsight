name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository boundaries
        run: ./scripts/check_repository_boundaries.sh

      - name: Run simulator smoke tests
        run: python -m unittest discover -s simulator/tests -v
