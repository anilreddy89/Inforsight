openapi: 3.1.0
info:
  title: Inforsight Enterprise Control Plane API
  version: 1.1.0
  description: >
    Enterprise control plane microservice orchestrating point-in-time policy triage,
    deterministic eligibility firewalls, knapsack uplift optimization, and governed
      human-in-the-loop caseworker decisions.
  x-contract-status: provisional-until-rh-09-accepted
  x-claim-boundary: Static topology does not establish authentication, authorization, latency, availability, or production readiness.
security:
  - bearerAuth: []
paths:
  /api/v1/cases/triage:
    post:
      summary: Execute batch policy triage and portfolio optimization
      description: >
        Consumes policy snapshot IDs, scores risk via Inference Runtime, applies deterministic
        eligibility rules, and solves constrained knapsack uplift allocation.
      operationId: executeTriageBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageBatchRequest'
      responses:
        '200':
          description: Batch triage successfully executed and cases allocated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cases/{case_id}:
    get:
      summary: Retrieve case brief and grounded evidence
      description: >
        Returns structured point-in-time case brief including factual summary, policy state,
        calibrated risk tier, recommended action, and grounding verification hash.
      operationId: getCaseBrief
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the conservation case
      responses:
        '200':
          description: Case brief retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseBrief'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/cases/{case_id}/decision:
    post:
      summary: Record licensed caseworker review decision
      description: >
        Enforces ADR 0002 human-in-the-loop sign-off. Records approval, override, or dismissal
        and appends an immutable record to the SHA-256 hash-chained audit ledger. Trusted actor
        establishment is separate from request payload identity; mutations require idempotency
        and expected case-version controls.
      operationId: recordCaseDecision
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseDecisionRequest'
      responses:
        '200':
          description: Decision successfully recorded in cryptographic audit ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDecisionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          description: Forbidden - Reviewer not licensed or authorized
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/cases/{case_id}/agent-drafts:
    post:
      summary: Record one untrusted review-only agent draft for a case
      description: >
        Requires an existing recommended case at the expected version. The
        server binds the draft to its own point-in-time snapshot; persistence
        profile atomically appends a hash-chain audit event. This request does
        not authenticate Python agent provenance, advance case state, create
        human approval, or authorize execution. Deployment authentication is
        not established by this local implementation.
      operationId: submitAgentDraft
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDraftSubmission'
      responses:
        '200':
          description: Advisory draft recorded or identically replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDraftRecord'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Stale case version, state conflict, or nonidentical replay
    get:
      summary: Retrieve the recorded advisory draft for specialist review
      operationId: getAgentDraft
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Case-bound advisory material retrieved without changing state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDraftRecord'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/cases/{case_id}/audit-trail:
    get:
      summary: Retrieve immutable cryptographic audit ledger for a case
      description: >
        Returns the sequential SHA-256 hash-chained audit events demonstrating complete
        lineage from case creation to final caseworker execution.
      operationId: getCaseAuditTrail
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cryptographic audit trail returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditTrailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  schemas:
    AgentDraftSubmission:
      type: object
      required: [contract_version, case_id, expected_case_version, status, action_id, reason_codes, evidence_source_ids, procedure_citations, authorized_to_act, human_review_required, idempotency_key]
      properties:
        contract_version:
          type: string
          const: '1.0.0'
        case_id:
          type: string
          maxLength: 128
        expected_case_version:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [DRAFT_FOR_REVIEW, ABSTAIN]
        action_id:
          type: [string, 'null']
          maxLength: 128
        reason_codes:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 128
        evidence_source_ids:
          type: array
          maxItems: 128
          items:
            type: string
            maxLength: 128
        procedure_citations:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 128
        authorized_to_act:
          type: boolean
          const: false
        human_review_required:
          type: boolean
          const: true
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128

    AgentDraftRecord:
      type: object
      required: [case_id, case_version, snapshot_id, draft, audit_record_hash, authorized_to_act]
      properties:
        case_id:
          type: string
        case_version:
          type: integer
        snapshot_id:
          type: string
        draft:
          $ref: '#/components/schemas/AgentDraftSubmission'
        audit_record_hash:
          type: [string, 'null']
          description: Null in the in-memory profile; SHA-256 ledger hash in persistence profile.
        authorized_to_act:
          type: boolean
          const: false

    RiskTier:
      type: string
      enum: [TIER_1_LOW, TIER_2_ELEVATED, TIER_3_HIGH, TIER_4_CRITICAL]
      description: Canonical RH-01 risk tier; ordinal increases with risk.
    TriageBatchRequest:
      type: object
      required:
        - as_of_date
        - policy_ids
      properties:
        as_of_date:
          type: string
          format: date-time
          example: '2026-09-06T00:00:00Z'
        policy_ids:
          type: array
          items:
            type: string
          example: ['POL-001', 'POL-002']
        specialist_capacity_hours:
          type: number
          default: 50.0
        budget_limit_usd:
          type: number
          default: 5000.00

    TriageBatchResponse:
      type: object
      required:
        - batch_id
        - total_evaluated
        - allocated_cases
        - total_spend_usd
        - total_specialist_hours
      properties:
        batch_id:
          type: string
        total_evaluated:
          type: integer
        allocated_cases:
          type: integer
        total_spend_usd:
          type: number
        total_specialist_hours:
          type: number
        cases:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummary'

    CaseSummary:
      type: object
      required:
        - case_id
        - policy_id
        - operational_tier
        - recommended_action
        - state
      properties:
        case_id:
          type: string
        policy_id:
          type: string
        operational_tier:
          $ref: '#/components/schemas/RiskTier'
        calibrated_probability:
          type: number
        recommended_action:
          type: string
        state:
          type: string
          enum: [CREATED, TRIAGED, EVIDENCE_ASSEMBLED, RECOMMENDED, HUMAN_REVIEWED, EXECUTED, DISMISSED, RESOLVED]

    CaseBrief:
      type: object
      required:
        - case_id
        - policy_id
        - as_of_date
        - current_state
        - factual_narrative
        - grounding_hash
        - recommended_action
      properties:
        case_id:
          type: string
        policy_id:
          type: string
        as_of_date:
          type: string
          format: date-time
        current_state:
          type: string
        calibrated_probability:
          type: number
        operational_tier:
          $ref: '#/components/schemas/RiskTier'
        factual_narrative:
          type: string
        grounding_hash:
          type: string
          description: SHA-256 digest of underlying policy features guaranteeing factual alignment
        recommended_action:
          type: string
        authorized_to_act:
          type: boolean
          nullable: false
          description: ADR 0002 boundary. Remains false until licensed caseworker decision is approved; presence is required where authority is evaluated.

    CaseDecisionRequest:
      type: object
      required:
        - reviewer_id
        - decision
        - timestamp
        - idempotency_key
        - expected_case_version
      properties:
        reviewer_id:
          type: string
          example: 'usr_spec_4091'
        decision:
          type: string
          enum: [APPROVED, OVERRIDDEN, REJECTED]
        selected_action:
          type: string
          description: Mandatory if decision is OVERRIDDEN
        rationale_code:
          type: string
          description: Standardized code for review decision
        notes:
          type: string
          description: Required free text if recommendation is OVERRIDDEN
        timestamp:
          type: string
          format: date-time
        idempotency_key:
          type: string
          minLength: 1
        expected_case_version:
          type: integer
          minimum: 0

    CaseDecisionResponse:
      type: object
      required:
        - case_id
        - transition_status
        - audit_record_hash
        - authorized_to_act
      properties:
        case_id:
          type: string
        transition_status:
          type: string
        audit_record_hash:
          type: string
          description: Cryptographic hash of the committed audit event
        authorized_to_act:
          type: boolean
          description: True only after an approved human decision; false for rejected or dismissed decisions. This response is not an inference-runtime response.

    AuditTrailResponse:
      type: object
      required:
        - case_id
        - events
        - chain_valid
      properties:
        case_id:
          type: string
        chain_valid:
          type: boolean
        events:
          type: array
          items:
            type: object
            required:
              - event_id
              - state_transition
              - timestamp
              - parent_hash
              - current_hash
            properties:
              event_id:
                type: string
              state_transition:
                type: string
              timestamp:
                type: string
                format: date-time
              parent_hash:
                type: string
              current_hash:
                type: string

  responses:
    BadRequestError:
      description: Invalid request payload or parameter
      content:
        application/json:
          schema:
            type: object
            properties:
              error_code:
                type: string
              message:
                type: string
    NotFoundError:
      description: Requested case or resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error_code:
                type: string
              message:
                type: string
    InternalServerError:
      description: Unexpected internal system error
      content:
        application/json:
          schema:
            type: object
            properties:
              error_code:
                type: string
              message:
                type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authentication transport only; trusted actor establishment and authorization remain separate enforced boundaries.
