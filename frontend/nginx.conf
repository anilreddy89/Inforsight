server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health { access_log off; return 200 'healthy'; add_header Content-Type text/plain; }
    location ~ ^/api/v1/demo/(scenarios|runs(?:/[^/]+(?:/(?:retry|decision|audit))?)?)$ {
        proxy_pass http://control-plane:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
