# Count only successful document requests to the app entry points. $request_uri
# is used before SPA rewrites; no query strings or visitor identifiers are logged.
map "$request_method:$request_uri:$status:$http_accept" $traffic_page_view {
    default 0;
    ~^GET:/(?:index\.html)?(?:\?[^:]*)?:(?:200|304):.*text/html 1;
}
log_format traffic escape=json 'INFORSIGHT_TRAFFIC {"v":1,"id":"$request_id","at":"$time_iso8601"}';
# Shared coarse gateway protection; durable per-visitor and global quotas live in Java/PostgreSQL.
limit_req_zone $server_name zone=demo_gateway:1m rate=30r/s;
limit_conn_zone $server_name zone=demo_connections:1m;
server {
    listen 80;
    access_log /dev/stdout traffic if=$traffic_page_view;
    access_log /var/log/inforsight/traffic.log traffic if=$traffic_page_view;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn demo_connections 100;
    server_tokens off;
    # Re-resolve container addresses after restart/recreation; never cache a
    # control-plane IP for the lifetime of this gateway.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health { access_log off; return 200 'healthy'; add_header Content-Type text/plain; }
    location ~ ^/api/v1/demo/(session|scenarios|runs(?:/[^/]+(?:/(?:retry|decision|audit))?)?)$ {
        limit_req zone=demo_gateway burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @busy;
        # API responses contain private fictional run evidence. Never cache them.
        add_header Cache-Control "no-store, private" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        set $demo_control_plane http://control-plane:8080;
        proxy_pass $demo_control_plane;
        proxy_connect_timeout 3s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Overwrite forwarded metadata. Client-supplied X-Forwarded-* never
        # establishes identity; secure cookies and CSRF are enforced by Java.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location @busy {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3" always;
        return 429 '{"code":"RATE_LIMITED","message":"The preview is receiving many requests. Please try again shortly.","retry_after_seconds":3}';
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
