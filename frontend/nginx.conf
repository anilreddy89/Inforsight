server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    # Re-resolve container addresses after restart/recreation; never cache a
    # control-plane IP for the lifetime of this gateway.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health { access_log off; return 200 'healthy'; add_header Content-Type text/plain; }
    location ~ ^/api/v1/demo/(scenarios|runs(?:/[^/]+(?:/(?:retry|decision|audit))?)?)$ {
        set $demo_control_plane http://control-plane:8080;
        proxy_pass $demo_control_plane;
        proxy_connect_timeout 3s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
