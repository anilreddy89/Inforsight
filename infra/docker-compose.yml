# Isolated fictional local journey. No cloud or external action capability.
# Start with: docker compose -f infra/docker-compose.yml up --build -d.
name: inforsight-demo

services:
  # ============================================================================
  # Streaming Gateway: Apache Kafka (KRaft mode, zero ZooKeeper dependency)
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.9.10
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      # Canonical base64 of the same cluster UUID. Kafka 3.9+ compares this text with
      # meta.properties literally, so existing volumes keep their identity.
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qg'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inforsight-network

  # ============================================================================
  # Relational Persistence & Cryptographic Audit Store: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${INFORSIGHT_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: inforsight_enterprise
      POSTGRES_USER: inforsight_app
      POSTGRES_PASSWORD: dev_insecure_local_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inforsight_app -d inforsight_enterprise"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inforsight-network

  # ============================================================================
  # Historical Phase 4 perception-layer sketch; gRPC is not implemented.
  # ============================================================================
  inference-runtime:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.inference
    ports:
      - "127.0.0.1:8000:8000"   # FastAPI HTTP/REST & diagnostics
    environment:
      INFERENCE_HOST: "0.0.0.0"
      INFERENCE_REST_PORT: "8000"
      INFORSIGHT_INFERENCE_WORKERS: "${INFORSIGHT_INFERENCE_WORKERS:-1}"
      INFORSIGHT_MODEL_BUNDLE_PATH: "/app/model/model-bundle.json"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - inforsight-network

  # ============================================================================
  # Control Plane: Java 21 / Spring Boot 3 Orchestration Microservice
  # ============================================================================
  control-plane:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.control-plane
    ports:
      - "127.0.0.1:8080:8080"   # Spring Boot REST API
    environment:
      SPRING_PROFILES_ACTIVE: persistence
      INFORSIGHT_DB_URL: "jdbc:postgresql://postgres:5432/inforsight_enterprise"
      INFORSIGHT_DB_USERNAME: "inforsight_app"
      INFORSIGHT_DB_PASSWORD: "dev_insecure_local_password"
      INFORSIGHT_EXTERNAL_EXECUTION_ENABLED: "false"
      INFORSIGHT_AUTHORIZED_TO_ACT: "false"
      INFORSIGHT_DEMO_ENABLED: "true"
      INFORSIGHT_JOURNEY_ENABLED: "true"
      INFORSIGHT_INFERENCE_TRANSPORT: "http"
      INFORSIGHT_INFERENCE_BASE_URL: "http://inference-runtime:8000"
      INFORSIGHT_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      INFORSIGHT_DEMO_RUNTIME_BASE_URL: "http://demo-runtime:8001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inference-runtime:
        condition: service_healthy
      demo-runtime:
        condition: service_healthy
    networks:
      - inforsight-network

  demo-runtime:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.demo-runtime
    environment:
      INFORSIGHT_EXTERNAL_EXECUTION_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
    networks:
      - inforsight-network

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${INFORSIGHT_DEMO_PORT:-3000}:80"
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - inforsight-network

networks:
  inforsight-network:
    driver: bridge

volumes:
  kafka_data:
    driver: local
  postgres_data:
    driver: local
