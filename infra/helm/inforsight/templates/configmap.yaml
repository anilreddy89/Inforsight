apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inforsight.fullname" . }}-config
  labels:
    {{- include "inforsight.labels" . | nindent 4 }}
data:
  INFORSIGHT_EXTERNAL_EXECUTION_ENABLED: {{ .Values.externalExecutionEnabled | quote }}
  INFORSIGHT_AUTHORIZED_TO_ACT: {{ .Values.authorizedToAct | quote }}
  INFORSIGHT_INFERENCE_BASE_URL: http://{{ include "inforsight.fullname" . }}-inference:{{ .Values.inference.port }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.externalKafka.bootstrapServers | quote }}
