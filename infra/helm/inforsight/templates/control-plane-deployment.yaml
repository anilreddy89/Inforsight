apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inforsight.fullname" . }}-control-plane
  labels:
    {{- include "inforsight.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: control-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.controlPlane.port }} }]
          envFrom: [{ configMapRef: { name: {{ include "inforsight.fullname" . }}-config } }]
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: persistence
            - name: INFORSIGHT_DB_URL
              value: jdbc:postgresql://{{ include "inforsight.fullname" . }}-postgres:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}
            - name: INFORSIGHT_DB_USERNAME
              value: {{ .Values.postgres.username | quote }}
            - name: INFORSIGHT_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "inforsight.fullname" . }}-postgres, key: password }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
