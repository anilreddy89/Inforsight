apiVersion: v1
kind: Service
metadata:
  name: {{ include "inforsight.fullname" . }}-inference
  labels:
    {{- include "inforsight.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: inference
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{ name: http, port: {{ .Values.inference.port }}, targetPort: http }]
