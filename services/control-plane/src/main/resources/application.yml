spring:
  application:
    name: inforsight-control-plane
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  jackson:
    property-naming-strategy: SNAKE_CASE
  threads:
    virtual:
      enabled: true
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
inforsight:
  contract-version: control-plane/1.0.0
  inference:
    transport: bounded
    base-url: http://localhost:8000
    timeout: 500ms
    max-attempts: 2
